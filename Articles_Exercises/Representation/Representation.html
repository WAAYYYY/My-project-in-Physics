<script>
  const articles = [
    {
      name: "Plan in R^2",
      image: "../../img/plan.jpeg",
      file: "plan.html"
    },
    {
      name: "Cylinders in R^3",
      image: "../../img/cylindre.jpeg",
      file: "cylindre.html"
    },
    {
      name: "Sphere in R^3",
      image: "../../img/sphere.png",
      file: "Sphere in R^3.html"
    }
  ];

  const container = document.getElementById("Articles");

  articles.forEach(article => {
    const col = document.createElement("div");
    col.className = "col-12 col-md-4"; // 3 colonnes sur écran moyen/grand

    const card = document.createElement("div");
    card.className = "card article-card h-100 shadow-sm";

    const img = document.createElement("img");
    img.src = article.image;
    img.alt = article.name;
    img.className = "card-img-top";
    img.style.height = "220px";
    img.style.objectFit = "cover";

    const cardBody = document.createElement("div");
    cardBody.className = "card-body";

    const title = document.createElement("h5");
    title.className = "card-title text-center";
    title.textContent = article.name;

    cardBody.appendChild(title);
    card.appendChild(img);
    card.appendChild(cardBody);
    col.appendChild(card);
    container.appendChild(col);

    card.addEventListener("click", () => {
      document.body.classList.add("fade-out-up");
      setTimeout(() => {
          window.location.href = article.file; 
      }, 600);
    });
 });
</script>
